# local postgres, for when docker is available.
# without docker, point DATABASE_URL at the Railway database's public url
# instead — see the README.

services:
  db:
    image: postgres:17-alpine
    container_name: shopify-practice-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: dev
      POSTGRES_DB: shopify_practice
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
